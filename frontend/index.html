<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Magic Air Card - 欢迎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-pink-50 flex items-center justify-center h-screen">
    <div class="bg-white p-10 rounded-[2rem] shadow-2xl text-center max-w-sm border-4 border-pink-200">
        <h1 class="text-4xl font-bold text-pink-500 mb-6">✨ 魔法空气贺卡</h1>
        <p class="text-gray-500 mb-8">用手势在空气中绘画，<br>制作独一无二的电子贺卡！</p>

        <div class="space-y-4">
            <input type="text" placeholder="输入你的昵称" class="w-full px-4 py-2 border-2 border-pink-100 rounded-full focus:outline-none focus:border-pink-300">
            <button onclick="location.href='/dashboard'" class="w-full bg-pink-400 text-white font-bold py-3 rounded-full hover:bg-pink-500 transition shadow-lg">
                开始创作 🚀
            </button>
        </div>
    </div>
</body>
</html>
